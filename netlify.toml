[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Each function declares its own route with `export const config = { path }`
# (Netlify Functions v2), which serves it at /api/<name> and NOT at
# /.netlify/functions/<name>.
#
# There used to be forced redirects here sending /api/* to
# /.netlify/functions/*. On the edge those won, and they pointed at paths that
# no longer exist once config.path is used — so every endpoint 404'd in
# production while working locally, where functions are matched before
# redirects. Do not add them back; the routing lives in the functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/lib/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep these pages
[[redirects]]
from = "/frequently-asked-questions/"
to = "/faq/"
status = 301

# 410 Gone for everything else (content permanently removed)
# This tells search engines "this content no longer exists" rather than
# redirecting to a random page. Good for cleaning up your index.

